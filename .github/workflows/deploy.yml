name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:

# 主题来源：saberzero1/quartz-themes（Obsidian 主题的 Quartz 移植版）
# 可选主题见 https://github.com/saberzero1/quartz-themes/tree/master/themes
env:
  THEME_NAME: typewriter

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. checkout 框架仓 + 初始化 submodule
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 把 submodule 更新到笔记仓 master 最新
      #    必须完整拉取（--unshallow）：submodule 默认是浅克隆，
      #    下一步还原笔记修改时间需要完整 git 历史
      - name: Update notes submodule to latest
        run: |
          git -C content fetch --unshallow origin master 2>/dev/null \
            || git -C content fetch origin master
          git -C content checkout origin/master

      # 3. 按笔记的 git 提交时间还原文件 mtime
      #    actions/checkout 会把所有文件 mtime 重置为 checkout 时刻，
      #    导致博客上所有笔记的修改时间都显示成"今天"。
      #    这里遍历每个文件，用它的 git 最后提交时间覆盖回去。
      - name: Restore notes mtime from git history
        run: |
          cd content
          git ls-files -z | while IFS= read -r -d '' f; do
            mtime=$(git log -1 --format='%ct' "$f" 2>/dev/null)
            if [ -n "$mtime" ]; then
              touch -d "@$mtime" "$f"
            fi
          done

      # 4. 构建
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      # 5. 注入社区主题（saberzero1/quartz-themes）
      #    脚本会拉取对应主题的 SCSS 到 quartz/styles/themes/，
      #    并在 custom.scss 里追加 @use "./themes";
      - name: Fetch Quartz Theme
        run: curl -s -S https://raw.githubusercontent.com/saberzero1/quartz-themes/master/action.sh | bash -s -- $THEME_NAME

      - uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ hashFiles('quartz.lock.json') }}
      - run: npx quartz plugin install --from-config
      - run: npx quartz build

      # 6. 写入自定义域名
      #    有自定义域名：把 <你的域名> 换成实际域名（如 blog.example.com），保留这行
      #    无自定义域名：删掉这行（用 <用户名>.github.io/<框架仓> 默认地址）
      - run: echo "blog.honlnk.com" > public/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
